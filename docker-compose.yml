# D3: Neo4j graph store. Start with `docker compose up -d`.
#
# The password comes from NEO4J_PASSWORD in `.env` (git-ignored); copy `.env.example`.
# Ports are bound to 127.0.0.1 only, so the database is not reachable from the network.
services:
  neo4j:
    image: neo4j:5.26.31-community
    container_name: domaingraph-neo4j
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474" # browser UI
      - "127.0.0.1:7687:7687" # bolt
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1g
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  neo4j-data:
